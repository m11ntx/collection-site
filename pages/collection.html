<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M11NTX | Collection</title>

<meta name="description" content="M11NTX — Premium Soccer Culture. Explore a collection and its clubs.">
<meta name="theme-color" content="#050505">

<!-- Favicon pack -->
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="assets/icons/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<a class="skip-link" href="#collectionDetail">Skip to content</a>

<!-- GLOBAL NAVIGATION (reused; always visible on subpages) -->
<header class="nav" id="siteNav">
    <div class="nav__inner">

        <a href="index.html" class="nav__logo" aria-label="M11NTX — Home">
            <img src="assets/images/symbol.png" alt="" class="nav__mark" width="30" height="21">
            <span class="nav__name">M11NTX</span>
        </a>

        <nav class="nav__menu" aria-label="Primary">
            <ul class="nav__list">
                <li><a href="index.html#collections" class="nav__link">Collection</a></li>
                <li><a href="#" class="nav__link" data-soon>Clubs</a></li>
                <li><a href="#" class="nav__link" data-soon>Leagues</a></li>
                <li><a href="#" class="nav__link" data-soon>About</a></li>
            </ul>
            <button type="button" class="nav__search" id="searchOpen" aria-label="Open search">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                </svg>
                <span>Search</span>
            </button>
        </nav>

        <button type="button" class="nav__toggle" id="menuToggle"
                aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
            <span class="nav__bar"></span>
            <span class="nav__bar"></span>
            <span class="nav__bar"></span>
        </button>

    </div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu__head">
        <span class="mobile-menu__brand">M11NTX</span>
        <button type="button" class="mobile-menu__close" id="menuClose" aria-label="Close menu">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>
    </div>
    <nav class="mobile-menu__nav" aria-label="Mobile">
        <a href="index.html#collections" class="mobile-menu__link">Collection</a>
        <a href="#" class="mobile-menu__link" data-soon>Clubs</a>
        <a href="#" class="mobile-menu__link" data-soon>Leagues</a>
        <a href="#" class="mobile-menu__link" data-soon>About</a>
        <button type="button" class="mobile-menu__link mobile-menu__search" id="searchOpenMobile">Search</button>
    </nav>
</div>

<!-- SEARCH OVERLAY (layout only) -->
<div class="search" id="searchOverlay" role="dialog" aria-modal="true"
     aria-label="Search the collection" aria-hidden="true">
    <button type="button" class="search__close" id="searchClose" aria-label="Close search">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
    </button>
    <form class="search__inner" role="search" onsubmit="return false">
        <label class="search__label" for="searchInput">Search the collection</label>
        <div class="search__field">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
            </svg>
            <input id="searchInput" class="search__input" type="search"
                   placeholder="Search clubs, leagues, jerseys…" autocomplete="off">
        </div>
        <p class="search__hint">Search is coming soon.</p>
    </form>
</div>

<!-- COLLECTION DETAIL — rendered from collections.json + clubs.json -->
<main class="detail" id="collectionDetail" aria-busy="true">
    <!-- content injected by catalog.js (Catalog.initDetail) -->
</main>

<footer class="site-footer">
    <span class="footer-left">&copy; 2026 M11NTX</span>
    <img src="assets/images/symbol.png" alt="M11" class="footer-mark">
    <span class="footer-right">Wear The Manto</span>
</footer>

<script src="assets/js/api.js" defer></script>
<script src="assets/js/image-loader.js" defer></script>
<script src="assets/js/catalog.js" defer></script>
<script src="assets/js/ui.js" defer></script>
<script src="assets/js/main.js" defer></script>

</body>
</html>
